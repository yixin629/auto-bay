services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autobay
      POSTGRES_PASSWORD: autobay
      POSTGRES_DB: autobay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    ports:
      - "8000:8010"
    command: /bin/sh -lc "/app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8010 --log-level info"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://autobay:autobay@postgres:5432/autobay
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv

  worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    command: /app/.venv/bin/celery -A app.workers.celery_app worker -l info -Q default,sync,ai
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://autobay:autobay@postgres:5432/autobay
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv

  beat:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    command: /app/.venv/bin/celery -A app.workers.celery_app beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://autobay:autobay@postgres:5432/autobay
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  minio_data:
